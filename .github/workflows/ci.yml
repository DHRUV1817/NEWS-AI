name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Lint
        run: uv run --python 3.12 --extra dev ruff check .

      - name: Type check
        run: uv run --python 3.12 --extra dev mypy newsninja evals

      - name: Test
        run: uv run --python 3.12 --extra dev pytest --cov=newsninja --cov-report=term-missing
        env:
          GROQ_API_KEY: test-key-not-real

  # A test count in a README is a claim, and this project's premise is that
  # every claim it makes is mechanically checkable. Left unchecked the number
  # drifts on the first change that adds a test — it already had, across three
  # files, in opposite directions. Runs both suites and compares.
  stated-counts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Counts come from each runner's machine-readable report, not from its
      # human-facing summary. Scraping that summary is what broke here once:
      # it parsed locally and failed on the runner, because the line is
      # formatted for people and formatting is allowed to change.
      - name: Run the python suite
        working-directory: api
        run: uv run --python 3.12 --extra dev pytest --junit-xml=/tmp/pytest.xml
        env:
          GROQ_API_KEY: test-key-not-real

      - name: Run the site suite
        working-directory: web
        run: |
          npm ci
          npx vitest run --reporter=json --outputFile=/tmp/vitest.json

      - name: The documentation states the counts the suites produce
        run: python3 scripts/check-stated-test-count.py /tmp/pytest.xml /tmp/vitest.json

  # The suite cannot see container defects: it imports the package directly and
  # never builds an image. Writing the Dockerfile surfaced three failures that
  # only appear at build or start time — an empty virtualenv, a package copied
  # but never installed, and an editable install pointing at a build directory
  # the runtime stage does not have. Each produced a container that exited
  # immediately while every test stayed green. This job is what keeps the
  # README's claim that the service is deployable from quietly going stale.
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t newsninja-api:ci api

      - name: Start it
        run: |
          docker run -d --name nn-ci -p 7860:7860 \
            -e GROQ_API_KEY=test-key-not-real \
            newsninja-api:ci

      # Polls rather than sleeping a fixed interval: a fixed wait is either
      # slower than it needs to be or flaky on a loaded runner.
      - name: Wait for it to serve
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7860/health >/dev/null 2>&1; then
              echo "serving"; exit 0
            fi
            sleep 1
          done
          echo "did not serve within 30s"; docker logs nn-ci; exit 1

      # Asserts the version came from package metadata. A container that copies
      # the source without installing it starts and then dies here, which is
      # exactly the failure this job exists to catch.
      - name: Health reports the packaged version
        run: |
          body=$(curl -fsS http://127.0.0.1:7860/health)
          echo "$body"
          echo "$body" | grep -q '"status":"ok"'
          echo "$body" | grep -qE '"version":"[0-9]+\.[0-9]+\.[0-9]+"'

      # An invalid body must produce the shared error envelope, not FastAPI's
      # default {"detail": [...]}. Checked against the running container rather
      # than the test client, since the two load the app differently.
      #
      # This doubles as the readiness check /health cannot be. FastAPI resolves
      # a route's dependencies before validating its body, so reaching a 422 on
      # /analyze proves the model client was constructed — the step that fails
      # on a bad key or an unparseable proxy variable while /health stays green.
      - name: Invalid request returns the shared envelope
        run: |
          code=$(curl -s -o /tmp/body.json -w '%{http_code}' \
            -X POST http://127.0.0.1:7860/analyze \
            -H 'Content-Type: application/json' -d '{}')
          cat /tmp/body.json
          test "$code" = "422"
          grep -q '"type":"invalid_request"' /tmp/body.json

      - name: Container logs on failure
        if: failure()
        run: docker logs nn-ci

      - name: Stop it
        if: always()
        run: docker rm -f nn-ci || true

  # The site was merged with no job of its own, so a broken page compiled only
  # on someone's laptop. It also renders its evaluation numbers from
  # docs/evals/latest.json at build time — and a missing file there degrades
  # silently to a "not run" state rather than failing, which is precisely the
  # kind of quiet wrong answer this project refuses everywhere else.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # ci, not install: the lock file is the contract, and a resolution that
      # drifts in CI is a build that does not match the one reviewed.
      - name: Install
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      # The run's orchestration lives in lib/briefing.ts rather than the
      # component, so the part worth testing — a refused topic not taking the
      # run down, and never briefing on an empty list — is exercised without a
      # browser. Mutation-checked: aborting on failure, briefing anyway, and
      # running topics concurrently each turn the suite red.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Asserts the page actually rendered the harness's numbers. A build that
      # succeeds while quietly falling back to "not run" would otherwise ship
      # a page claiming nothing has been measured when the report is right
      # there in the repository.
      - name: The page carries the published eval numbers
        run: |
          page=.next/server/app/index.html
          test -f "$page" || { echo "no prerendered page at $page"; exit 1; }
          grep -q "Claims counted" "$page"
          grep -q "Quote grounding rate" "$page"
          if grep -q "No report has been generated yet" "$page"; then
            echo "page fell back to the not-run state despite docs/evals/latest.json being committed"
            exit 1
          fi
